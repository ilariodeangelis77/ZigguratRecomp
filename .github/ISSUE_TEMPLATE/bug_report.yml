name: Bug report
description: Something does not work or differs from the original game
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never attach game files** (`.ipa`, `.app`, images, audio, text) or links to them.
        Issues asking for game files are closed.
  - type: checkboxes
    id: no-game-files
    attributes:
      label: Game files
      options:
        - label: I did not attach or link any game files, and I am using my own copy of the game.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the launcher's ABOUT tab (e.g. 0.9.0)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, Steam Deck, Other]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU / display setup
      description: e.g. "RTX 3060, 1440p 144 Hz, borderless, integer scaling on"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? For gameplay differences, describe how the original behaves.
    validations:
      required: true
  - type: textarea
    id: support-info
    attributes:
      label: Support info
      description: Launcher → DATA → COPY SUPPORT INFO, then paste here (personal paths are anonymised).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The last lines of the newest `logs/game-*.log` or `logs/launcher-*.log` (DATA → OPEN LOGS).
      render: text
